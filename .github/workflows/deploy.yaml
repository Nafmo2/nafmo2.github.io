name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # ビルドに影響するファイルだけを対象にする。
    # README や記事ガイドなど、サイトの生成物が変わらない push では実行しない。
    # ビルド入力が増えたらここに追加する（定期実行は毎日 00:00 JST）。
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *" # 00:00 JST

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # 手動実行で他ブランチからデプロイしないための保険。
    # GitHub の github-pages 環境でも Deployment branches を main のみに制限する。
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
